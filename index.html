<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大学課題 Webページ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    .toggle-btn {
      padding: 8px 14px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
    }
    .note-box {
      margin-top: 16px;
      padding: 12px 16px;
      border-left: 4px solid #333;
      background: #fafafa;
    }
    .is-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Webページ課題</h1>
  <p>HTML・CSS・JavaScriptを使用して作成した公開ページです。</p>

  <button id="toggle-btn" class="toggle-btn" type="button" aria-expanded="false">
    補足を表示
  </button>

  <div id="note-box" class="note-box is-hidden">
    <p>JavaScriptのクリックイベントによって表示状態を切り替えています。</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("toggle-btn");
      const box = document.getElementById("note-box");
      if (!btn || !box) return;

      btn.addEventListener("click", () => {
        const hidden = box.classList.toggle("is-hidden");
        btn.setAttribute("aria-expanded", String(!hidden));
        btn.textContent = hidden ? "補足を表示" : "補足を隠す";
      });
    });
  </script>
</body>
</html>
